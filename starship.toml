


format = """
[](fg:#9A348E)\
$os\
$username\
[ ](bg:#5555ff fg:#9A348E)\
$directory\
[ ](fg:#5555ff bg:#6c49c5)\
$git_branch\
$git_status\
[ ](fg:#6c49c5 bg:#352c44)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$python\
[ ](fg:#352c44 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
$line_break\
$character\
"""


[os]
disabled = false
style = "bg:#9A348E fg:#ffffff"

[os.symbols]
Macos = "󰀵 "
#style = "#5555ff"

[username]
show_always = true
#style_user = "bg:#9A348E"
#style_root = "bg:#9A348E"
format = '[$user ](bg:#9A348E fg:#ffffff)'
disabled = false



[nodejs]
disabled = true


[directory]
format = "[$path ]($style)"
truncation_length = 100   # 省略が起きないように非常に大きな数字を指定
truncate_to_repo = false  # Gitリポジトリ内でもパスを省略しない
style = "bg:#5555ff fg:#ffffff"



[git_status]
style = "fg:bold yellow bg:#6c49c5"        # 変更がある時は赤くする
format = '[[($all_status$ahead_behind )](fg:#dde722 bg:#6c49c5)]($style)'

[git_branch]
style = "fg:#fde77c bg:#6c49c5"
format = "[on $symbol$branch ]($style)"
#symbol = ""


[python]
pyenv_version_name = true
format = '[(\($virtualenv\) )]($style)'
style = "bg:#352c44"

[c]
format = '[$name $version]($style)'
style = 'bg:#352c44'

[cpp]
format = '[$name $version]($style)'
style = 'bg:#352c44'

[golang]
symbol = " "
style = "bg:#352c44"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#352c44"
format = '[ $symbol ($version) ]($style)'


[time]
disabled = false
style = "bg:#1d2230"
time_format = "%T"
format = '[ $time]($style)'



[line_break]
disabled = false


# 入力記号をシンプルに
[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"

